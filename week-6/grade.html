<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade</title>
</head>
<body>
    <script>

        var score = 52;

        if (score < 0 || score > 100) {
            document.write("Not a valid score!")
        }
        else if (score >= 72) {
            document.write("Well done!");
        }
        else if(score >= 40) {
            document.write("You passed!");
        }
        else{
            document.write("You failed");
        }
    

    </script>
    
</body>
</html>
