<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting</title>
</head>
<body>
    <script>
        var lastNumber = Number(prompt("Please enter a number to count to"));
        for (var i= 1; i<=lastNumber ; i++) {
            document.write(i + "<br>");
        }
    </script>
</body>
</html>
