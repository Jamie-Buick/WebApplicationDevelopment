    <title>Area</title>
</head>
<body>


    <script>
        function getArea(width, height){
            return width * height;
        }

        var wallWidth = 10;
        var wallHeight = 6;

        var wallArea = getArea(wallWidth, wallHeight);
        alert(wallArea);
      
    </script>
    
</body>
