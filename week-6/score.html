<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score</title>
</head>
<body>
    <script>

        var score = Number(prompt("Please enter your exam score"));
        if (score >= 40) {
            document.write("You passed");
        }else{
            document.write("You failed");
        }

    </script>
    
</body>
</html>
