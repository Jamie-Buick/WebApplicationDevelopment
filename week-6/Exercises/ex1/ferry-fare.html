<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        // This page asks for a passengers age and displays the correct fare
        var age = Number(prompt("Please enter your age."));

        if(age < 0 || age > 130) {
            document.write("This is not a valid age.");

        }
        else if(age < 5) {
            document.write("Free fare");
        }
        else if (age < 16) {
            document.write("Child fare");4
        }
      
        else{
            document.write("Adult fare");
        }
    </script>
    
</body>
</html>
