<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Times table</h1>
    <script>
        var tableNumber = Number(prompt("Which times tables would you like?"));

        for(var i = 1; i <= 10; i++) {
            var product = i * tableNumber;
            document.write(i + " x " + tableNumber + " = " + product + "<br>");
        }
    </script>
</body>
</html>
