<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Times</title>
</head>
<body>
    <h1>Island Ferry sailings</h1>
    <p>First sailing: <span id="first-sailing"></span></p>
    <p>Sailings today: <span id="sailing-count"></span></p>
    <ul id="sailing-list"></ul>
    <p id="midday-note"></p>
    <p>Last sailing: <span id="last-sailing"></span></p>

    <script>
        // The sailing times in order
        const sailings = ['08:30', '10:00', '12:30', '15:00'];
        sailings.push('18:30');



        // The first saling and how many there are
        const firstSailing = document.getElementById('first-sailing');
        firstSailing.textContent = sailings[0];

        const sailingCount = document.getElementById('sailing-count');
        sailingCount.textContent = sailings.length;
        
        const sailingList = document.getElementById('sailing-list');
        for (const sailing of sailings) {
            const item = document.createElement('li');
            item.textContent = sailing;
            sailingList.append(item);
            
        }

        const middayNote = document.getElementById('midday-note');
        if (sailings.indexOf('12:30') !== -1) {             // -1 means not found.
            middayNote.textContent = 'There is a midday sailing.'
        }


        const lastSailing = document.getElementById('last-sailing');
        lastSailing.textContent = sailings[sailings.length - 1];
        

        
        
    </script>
    
</body>
</html>
